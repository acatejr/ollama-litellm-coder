# AI stack: Ollama + LiteLLM proxy (with Postgres for keys/spend tracking).
#
# On the droplet this lives in /opt/ai-stack/ next to litellm-config.yaml and a
# .env file that cloud-init generates with the secrets below.
#
# Required variables (from .env or the shell):
#   LITELLM_MASTER_KEY   LiteLLM admin/API master key (must start with "sk-")
# Optional:
#   POSTGRES_PASSWORD    defaults to "litellmpassword"

services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm_db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellmpassword}
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1       # Directs 100% CPU to a single prompt at a time
      - OLLAMA_MAX_LOADED_MODELS=1   # Prevents RAM swapping
      - OLLAMA_KEEP_ALIVE=-1         # Prevents unloading model on idle
      - OLLAMA_CONTEXT_LENGTH=32768  # Default context if a request doesn't set num_ctx
      - OLLAMA_FLASH_ATTENTION=1     # Faster, lower-memory attention on long prompts
      - OLLAMA_KV_CACHE_TYPE=q8_0    # Halves context-cache RAM vs f16 (needs flash attention)
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

  ollama-pull-model:
    image: curlimages/curl:latest
    container_name: ollama_pull_model
    depends_on:
      - ollama
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Ollama service...';
      while ! curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
      echo 'Pulling qwen2.5-coder:3b model...';
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5-coder:3b\"}';
      echo 'Model pull completed.';
      "

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD:-litellmpassword}@postgres:5432/litellm
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_storage:
  postgres_data:
